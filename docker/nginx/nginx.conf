# Edge reverse proxy — TLS termination, security headers, edge rate limit.
# Backend (3001) and frontend (3000) stay on the internal edge network only.

upstream backend {
    server backend:3001;
}

upstream frontend {
    server frontend:3000;
}

# Edge rate limit — 10 req/s per IP for API, burst 20.
limit_req_zone $binary_remote_addr zone=api_edge:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=web_edge:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers (edge layer — app also sends its own via helmet)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Body cap — clinical payloads are small; blocks oversized uploads early.
    client_max_body_size 2m;

    # API → backend
    location /api/ {
        limit_req zone=api_edge burst=20 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Health endpoints — passthrough for LB/monitoring probes
    location ~ ^/(health|readyz|metrics)$ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        limit_req zone=api_edge burst=5 nodelay;
    }

    # Everything else → Next.js frontend
    location / {
        limit_req zone=web_edge burst=50 nodelay;
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
