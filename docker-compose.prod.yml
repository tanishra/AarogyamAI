# Production deployment — single host via Docker Compose.
#
# Project name is pinned to aarogyam-prod so this stack NEVER collides with
# the dev compose project (default name: aarogyamai). Without this, `up -d`
# here recreates the dev aarogyam-postgres/aarogyam-redis containers and
# wipes dev credentials.
name: aarogyam-prod
#
# Usage:
#   1. cp .env.production.example .env.production   # fill in secrets
#   2. docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#   3. docker compose -f docker-compose.prod.yml exec migrate   # one-off, or use profile
#
# Migrations run via: docker compose -f docker-compose.prod.yml run --rm backend \
#   node dist/migrations/run-migrations.js up
#
# Backups: see scripts/backup-db.sh (cron on host) — pg_dump to ./backups/

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aarogyam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aarogyam}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    # No host port published — backend reaches it over the compose network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-aarogyam}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aarogyam}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_ENABLED: ${AI_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4-turbo-preview}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_REPORTS_BUCKET: ${S3_REPORTS_BUCKET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
    volumes:
      - reports:/app/packages/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal, edge]
    # No host port — reachable only via nginx.

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal, edge]
    # No host port — reachable only via nginx.

  # Edge reverse proxy — the ONLY published surface (80/443).
  # Certs: mount real certs into ./docker/nginx/certs, or the container
  # generates a self-signed pair on first boot for staging.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs
    command: ["sh", "-c", "[ -f /etc/nginx/certs/server.crt ] || (apk add --no-cache openssl >/dev/null 2>&1; openssl req -x509 -nodes -newkey rsa:2048 -days 365 -keyout /etc/nginx/certs/server.key -out /etc/nginx/certs/server.crt -subj /CN=aarogyam.local -batch); exec nginx -g 'daemon off;'"]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [edge]

  # One-off migration runner — invoke manually:
  #   docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aarogyam}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aarogyam}
    command: ["node", "dist/migrations/run-migrations.js", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # Optional scheduled backup — enable with: --profile backup
  # Runs pg_dump daily into ./backups (mounted volume on host)
  backup:
    image: postgres:15-alpine
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-aarogyam}
      POSTGRES_DB: ${POSTGRES_DB:-aarogyam}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "while true; do
        pg_dump -h postgres -U $${POSTGRES_USER} -d $${POSTGRES_DB}
          -Fc -f /backups/aarogyam-$$(date +%Y%m%d-%H%M).dump;
        find /backups -name 'aarogyam-*.dump' -mtime +14 -delete;
        sleep 86400;
      done"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # Optional observability stack — enable with: --profile monitoring
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    networks: [edge]

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"   # localhost-only; access via SSH tunnel in prod
    depends_on: [prometheus]
    networks: [edge]

networks:
  internal:
    internal: true   # postgres/redis/backend-db traffic never leaves host
  edge:
    # frontend + backend published ports live here

volumes:
  pgdata:
  redisdata:
  reports:
  promdata:
  grafanadata:
